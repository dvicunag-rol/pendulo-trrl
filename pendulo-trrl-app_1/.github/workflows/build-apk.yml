name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: pendulo-trrl-app_1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Regenerar www/index.html desde src/
        run: python3 build.py

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso de cámara
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M

      - name: Sincronizar archivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: pendulo-trrl-app_1/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pendulo-TRRL-APK
          path: pendulo-trrl-app_1/android/app/build/outputs/apk/debug/app-debug.apk
